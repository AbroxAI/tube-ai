<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>YouTube Mobile UI — Passive Hustler</title>

<style>
:root{
  --bg:#0F0F0F;
  --chip:#272727;
  --chip-active:#F1F1F1;
  --text:#F1F1F1;
  --muted:#AAAAAA;
  --red:#FF0033;

  --inset:20px;
  --header-h:76px;
  --chips-h:72px;
  --chip-h:50px;
  --nav-h:96px;
  --short-gap:11px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  scrollbar-width:none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
  width:0;
  height:0;
  display:none;
}

body{
  width:100%;
  max-width:691px;
  min-height:100vh;
  margin:0 auto;

  overflow-x:hidden;
  overflow-y:auto;

  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  padding-bottom:calc(var(--nav-h) + 2px);

  -webkit-tap-highlight-color:transparent;
  scrollbar-width:none;
}

button{
  font:inherit;
  color:inherit;
}

/* =========================
   HEADER
========================= */

.top-header{
  height:var(--header-h);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  background:var(--bg);
}

.youtube-logo{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

.yt-play-mark{
  width:46px;
  height:33px;
  display:block;
}

.yt-wordmark{
  font-family:Arial,Helvetica,sans-serif;
  font-size:26px;
  font-weight:650;
  line-height:1;
  letter-spacing:-1px;
  white-space:nowrap;
}

.header-icons{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-icon-btn{
  width:36px;
  height:36px;
  border:0;
  background:transparent;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;
}

.header-icon-btn svg{
  width:28px;
  height:28px;
  display:block;
}

/* =========================
   CATEGORY BAR
========================= */

.category-scroller{
  height:var(--chips-h);

  display:flex;
  align-items:center;

  gap:10px;

  padding-left:var(--inset);
  padding-right:0;

  overflow-x:auto;
  overflow-y:hidden;

  white-space:nowrap;

  scrollbar-width:none;
  -ms-overflow-style:none;
}

.category-scroller::-webkit-scrollbar{
  display:none;
}

.explore-btn{
  width:62px;
  height:var(--chip-h);

  flex:0 0 auto;

  border:0;
  border-radius:9px;

  background:#242424;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;
}

.explore-btn svg{
  width:29px;
  height:29px;
}

.chip{
  height:var(--chip-h);

  flex:0 0 auto;

  padding:0 16px;

  border:0;
  border-radius:12px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  white-space:nowrap;

  font-size:18px;
  font-weight:400;
}

.chip-all{
  padding:0 20px;
  background:var(--chip-active);
  color:#181818;
  font-weight:500;
}

.chip-unselected{
  background:var(--chip);
  color:#E5E5E5;
}

/* =========================
   MAIN VIDEO
========================= */

.main-video{
  width:100%;
  aspect-ratio:691/388;

  overflow:hidden;

  background:#1A1A1A;
}

.main-video img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

/* =========================
   VIDEO META
========================= */

.video-meta{
  display:flex;
  align-items:flex-start;

  gap:13px;

  padding:15px var(--inset) 0;

  position:relative;
}

.channel-avatar{
  width:52px;
  height:52px;

  flex:0 0 52px;

  border-radius:50%;

  overflow:hidden;

  background:#333;
}

.channel-avatar img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.meta-text{
  min-width:0;
  flex:1;

  padding-right:30px;
}

.video-title{
  font-size:17px;
  font-weight:450;
  line-height:22px;

  color:var(--text);

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  overflow:hidden;
}

.video-secondary{
  margin-top:4px;

  font-size:13px;
  font-weight:400;
  line-height:18px;

  color:var(--muted);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta-overflow,
.shorts-overflow{
  width:24px;
  height:24px;

  border:0;
  background:transparent;

  padding:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;
}

.meta-overflow{
  position:absolute;
  right:18px;
  top:17px;
}

.meta-overflow span,
.shorts-overflow span{
  width:4px;
  height:4px;

  background:#F1F1F1;

  border-radius:50%;
}

/* =========================
   SHORTS
========================= */

.shorts-section{
  padding-top:31px;
}

.shorts-header{
  height:46px;

  display:flex;
  align-items:center;

  padding:0 var(--inset);

  gap:13px;

  position:relative;
}

.shorts-icon{
  width:36px;
  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:0 0 36px;
}

.shorts-icon svg{
  width:36px;
  height:36px;
}

.shorts-title{
  font-size:23px;
  font-weight:650;
  line-height:1;
  letter-spacing:-.2px;
}

.shorts-overflow{
  position:absolute;

  right:18px;
  top:50%;

  transform:translateY(-50%);
}

.shorts-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:var(--short-gap);

  padding:4px var(--inset) 0;
}

.short-card{
  aspect-ratio:316/464;

  overflow:hidden;

  border-radius:9px;

  background:#1A1A1A;
}

.short-card img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

/* =========================
   BOTTOM NAVIGATION
========================= */

.bottom-navigation{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:var(--nav-h);
  width:100%;

  max-width:691px;

  margin:0 auto;

  background:var(--bg);

  border-top:1px solid #202020;

  z-index:100;
}

.nav-items{
  height:100%;

  display:flex;
  align-items:stretch;
}

.nav-item{
  flex:1;
  min-width:0;

  border:0;
  background:transparent;

  padding:8px 0 0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:flex-start;

  gap:4px;
}

.nav-icon{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:0 0 30px;
}

.nav-icon svg{
  width:100%;
  height:100%;
}

.nav-label{
  font-size:12px;
  font-weight:450;
  line-height:1;

  color:#F1F1F1;

  white-space:nowrap;
}

.nav-create-circle{
  width:54px;
  height:54px;

  margin-top:-8px;

  border-radius:50%;

  background:#2D2D2D;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:0 0 54px;
}

.nav-create-circle svg{
  width:26px;
  height:26px;
}

.nav-profile-avatar{
  width:34px;
  height:34px;

  border-radius:50%;

  overflow:hidden;

  flex:0 0 34px;
}

.nav-profile-avatar img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:400px){

  :root{
    --inset:14px;
    --header-h:62px;
    --chips-h:58px;
    --chip-h:42px;
    --nav-h:84px;
    --short-gap:8px;
  }

  .top-header{
    padding:0 16px;
  }

  .youtube-logo{
    gap:5px;
  }

  .yt-play-mark{
    width:40px;
    height:29px;
  }

  .yt-wordmark{
    font-size:22px;
    letter-spacing:-.8px;
  }

  .header-icons{
    gap:10px;
  }

  .header-icon-btn{
    width:32px;
    height:32px;
  }

  .header-icon-btn svg{
    width:25px;
    height:25px;
  }

  .category-scroller{
    gap:8px;
  }

  .explore-btn{
    width:52px;
    height:42px;
    border-radius:8px;
  }

  .explore-btn svg{
    width:25px;
    height:25px;
  }

  .chip{

    padding:0 13px;
    border-radius:10px;
  }

  .chip-all{
    padding:0 16px;
  }

  .video-meta{
    gap:11px;
    padding-top:13px;
  }

  .channel-avatar{
    width:44px;
    height:44px;
    flex-basis:44px;
  }

  .meta-text{
    padding-right:26px;
  }

  .video-title{
    font-size:15px;
    line-height:19px;
    font-weight:450;
  }

  .video-secondary{
    font-size:12px;
    line-height:16px;
    margin-top:3px;
  }

  .shorts-section{
    padding-top:26px;
  }

  .shorts-header{
    gap:10px;
    height:40px;
  }

  .shorts-icon,
  .shorts-icon svg{
    width:32px;
    height:32px;
  }

  .shorts-icon{
    flex-basis:32px;
  }

  .shorts-title{
    font-size:20px;
    font-weight:650;
  }

  .shorts-grid{

  }

  .short-card{
    border-radius:8px;
  }

  .nav-icon{
    width:25px;
    height:25px;
    flex-basis:25px;
  }

  .nav-label{
    font-size:11px;
  }

  .nav-item{
    padding-top:7px;
    gap:3px;
  }

  .nav-create-circle{
    width:48px;
    height:48px;
    flex-basis:48px;
    margin-top:-6px;
  }

  .nav-create-circle svg{
    width:23px;
    height:23px;
  }

  .nav-profile-avatar{
    width:30px;
    height:30px;
    flex-basis:30px;
  }
}
</style>
</head>

<script>

/* ==========================================================
   SVG IMAGE GENERATOR
========================================================== */

function svgData(
  text,
  backgroundA,
  backgroundB,
  accent,
  subtitle = ''
){

  const esc = value =>
    String(value)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');

  const svg = `
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="506"
    viewBox="0 0 900 506">

    <defs>

      <linearGradient
        id="g"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
          offset="0"
          stop-color="${backgroundA}"/>

        <stop
          offset="1"
          stop-color="${backgroundB}"/>

      </linearGradient>

      <radialGradient id="r">

        <stop
          offset="0"
          stop-color="${accent}"
          stop-opacity=".85"/>

        <stop
          offset="1"
          stop-color="${accent}"
          stop-opacity="0"/>

      </radialGradient>

    </defs>

    <rect
      width="900"
      height="506"
      fill="url(#g)"/>

    <circle
      cx="760"
      cy="100"
      r="230"
      fill="url(#r)"/>

    <circle
      cx="130"
      cy="470"
      r="180"
      fill="#000"
      opacity=".18"/>

    <rect
      x="36"
      y="34"
      width="150"
      height="42"
      rx="21"
      fill="#000"
      opacity=".4"/>

    <text
      x="111"
      y="62"
      text-anchor="middle"
      fill="#fff"
      font-family="Arial"
      font-size="20"
      font-weight="700">
      PASSIVE HUSTLER
    </text>

    <text
      x="48"
      y="330"
      fill="#fff"
      font-family="Arial"
      font-size="56"
      font-weight="800">
      ${esc(text)}
    </text>

    ${
      subtitle
      ? `
      <text
        x="50"
        y="382"
        fill="#fff"
        opacity=".92"
        font-family="Arial"
        font-size="26"
        font-weight="500">
        ${esc(subtitle)}
      </text>
      `
      : ''
    }

    <rect
      x="48"
      y="420"
      width="170"
      height="8"
      rx="4"
      fill="#fff"
      opacity=".75"/>

    <circle
      cx="815"
      cy="424"
      r="45"
      fill="#FF0033"/>

    <polygon
      points="802,402 802,446 837,424"
      fill="#fff"/>

  </svg>
  `;

  return 'data:image/svg+xml;charset=UTF-8,' +
         encodeURIComponent(svg);
}


/* ==========================================================
   AVATARS
========================================================== */

const channelAvatar =
svgData(
  'PH',
  '#191919',

  '#FF0033',
  'PASSIVE HUSTLER'

document.getElementById('channel-avatar').src =

document.getElementById('profile-avatar').src =
  svgData(
    'PH',

    '#080808',
    '#FF0033',

/* ==========================================================
   VIDEO DATA
========================================================== */

const videoOptions = [

  {
    title:

/* ==========================================================
   RANDOMIZER
========================================================== */

function cryptoIndex(max, avoid = -1){

  let n =
    Math.floor(Math.random() * max);

  if(
    window.crypto &&
    crypto.getRandomValues
  ){

    const u =
      new Uint32Array(1);

    crypto.getRandomValues(u);

    n = u[0] % max;
  }

  if(
    max > 1 &&
    n === avoid
  ){

    n =
      (n + 1) % max;
  }

  return n;
}


/* ==========================================================
   PICK MAIN VIDEO
========================================================== */

function pickVideo(){

  let last = -1;

  try{

    last =
      Number(
        localStorage.getItem(
          'yt_ui_last_video'
        )
      );

  }catch(e){}

  const index =
    cryptoIndex(
      videoOptions.length,
      Number.isFinite(last)
        ? last
        : -1
    );

  try{

    localStorage.setItem(
      'yt_ui_last_video',
      String(index)
    );

  }catch(e){}

  return videoOptions[index];
}


/* ==========================================================
   PICK SIX SHORTS
========================================================== */

function pickShorts(){

  let pool =
    [...shortOptions];

  let lastKey = '';

  try{

    lastKey =
      localStorage.getItem(
        'yt_ui_last_shorts'
      ) || '';

  }catch(e){}


  if(lastKey){

    const filtered =
      pool.filter(
        (_, i) =>
          String(i) !== lastKey
      );

    if(filtered.length >= 6){

      pool = filtered;
    }
  }


  /* Fisher-Yates shuffle */

  for(
    let i = pool.length - 1;
    i > 0;
    i--
  ){

    const j =
      cryptoIndex(i + 1);

    [
      pool[i],
      pool[j]
    ] =
    [
      pool[j],
      pool[i]
    ];
  }


  const chosen =
    pool.slice(0,6);


  const marker =
    shortOptions.findIndex(
      x =>
        x.title ===
        chosen[0].title
    );


  try{

    localStorage.setItem(
      'yt_ui_last_shorts',
      String(marker)
    );

  }catch(e){}


  return chosen;
}

function render(){

  const video =
    pickVideo();


  /* MAIN VIDEO */

  document
    .getElementById(
      'hero-image'

    video.image;


  document
    .getElementById(
      'video-title'
    )
    .textContent =
    video.title;


  document
    .getElementById(
      'video-secondary'
    )
    .textContent =
    video.meta;


  /* SHORTS */

  const grid =
    document.getElementById(
      'shorts-grid'
    );

  grid.innerHTML = '';


  for(
    const item of pickShorts()
  ){

    const card =
      document.createElement(
        'article'
      );

    card.className =
      'short-card';


    const img =
      document.createElement(
        'img'
      );

    img.src =
      item.image;

    img.alt =
      item.title;


    card.appendChild(img);

    grid.appendChild(card);
  }
}
