<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>YouTube Mobile UI — Passive Hustler</title>
<style>
:root{--bg:#0F0F0F;--text:#F1F1F1;--muted:#AAAAAA;--red:#FF0033;--chip:#272727;--inset:20px;--header-h:76px;--chips-h:72px;--chip-h:50px;--nav-h:96px;--short-gap:8px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.category-scroller::-webkit-scrollbar{width:0;height:0;display:none}
body{width:100%;max-width:691px;min-height:100vh;margin:0 auto;overflow-x:hidden;overflow-y:auto;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(var(--nav-h) + 3px);scrollbar-width:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}

/* Header */
.top-header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--bg)}
.youtube-logo{display:flex;align-items:center;gap:6px;flex-shrink:0}
.yt-play-mark{width:46px;height:33px;display:block}
.yt-wordmark{font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:500;line-height:1;letter-spacing:-1px;white-space:nowrap}
.header-icons{display:flex;align-items:center;gap:14px}
.header-icon-btn{width:36px;height:36px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.header-icon-btn svg{width:28px;height:28px;display:block}

/* Category chips */
.category-scroller{height:var(--chips-h);display:flex;align-items:center;gap:10px;padding-left:var(--inset);padding-right:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none}
.explore-btn{width:62px;height:var(--chip-h);flex:0 0 auto;border:0;border-radius:9px;background:#242424;display:flex;align-items:center;justify-content:center;padding:0}
.explore-btn svg{width:29px;height:29px}
.chip{height:42px;flex:0 0 auto;padding:0 13px;border:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-size:15px;font-weight:400}
.chip-all{padding:0 16px;background:#F1F1F1;color:#181818;font-weight:500}
.chip-unselected{background:var(--chip);color:#E5E5E5}

/* Video player */
.main-video{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:#1A1A1A}
.main-video video{width:100%;height:100%;display:block;object-fit:cover;background:#1A1A1A}
.video-overlays{position:absolute;inset:0;z-index:2;pointer-events:none}
.video-overlays>*{pointer-events:auto}
.mute-icon{position:absolute;top:15px;right:15px;width:77px;height:77px;opacity:1;background:#3A3A3A;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mute-icon svg{width:48px;height:49px;display:block}
.cc-control{position:absolute;top:108px;right:15px;width:77px;height:77px;display:flex;align-items:center;justify-content:center;background:#3A3A3A;border-radius:50%;border:0;font-size:0;font-weight:750;letter-spacing:.4px;line-height:1}
.cc-control .cc-label{display:flex;align-items:center;justify-content:center;width:42px;height:34px;background:#F1F1F1;color:#666;border-radius:4px;font-size:13px;font-weight:750;letter-spacing:1px;line-height:1}
.subtitle-overlay{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);padding:5px 14px 6px;background:rgba(0,0,0,.82);border-radius:4px;color:#fff;font-size:16px;font-weight:500;line-height:22px;white-space:nowrap}
.duration-indicator{position:absolute;right:10px;bottom:14px;padding:5px 7px;background:rgba(0,0,0,.84);border-radius:4px;color:#fff;font-size:12px;font-weight:400;line-height:1;letter-spacing:.2px}
.progress-container{position:absolute;left:0;right:0;bottom:0;height:19px;display:flex;align-items:flex-end;z-index:3;cursor:pointer}
.progress-track{width:100%;height:4px;position:relative;background:rgba(255,255,255,.22);cursor:pointer}
.progress-active{width:0%;height:100%;position:relative;background:var(--red);pointer-events:none}
.progress-knob{position:absolute;top:50%;right:-7px;width:14px;height:14px;transform:translateY(-50%);background:var(--red);border-radius:50%;cursor:grab;pointer-events:auto}
.progress-knob:active{cursor:grabbing}

/* Autoplay fallback overlay */
.video-play-overlay{position:absolute;inset:0;z-index:5;display:none;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}
.video-play-overlay.show{display:flex}
.video-play-overlay svg{width:72px;height:72px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6))}

/* Video metadata */
.video-meta{display:flex;align-items:flex-start;gap:11px;padding:13px var(--inset) 0;position:relative}
.channel-avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;overflow:hidden;background:#3A3A3A}
.channel-avatar img{width:100%;height:100%;display:block;object-fit:cover;background:#3A3A3A}
.meta-text{min-width:0;flex:1;padding-right:26px}
.video-title{font-size:15px;line-height:19px;font-weight:400;color:var(--text);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.video-secondary{font-size:12px;line-height:16px;margin-top:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-overflow,.shorts-overflow{width:24px;height:24px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;opacity:.95}
.meta-overflow{position:absolute;right:15px;top:14px}
.meta-overflow span,.shorts-overflow span{width:4px;height:4px;background:#F1F1F1;border-radius:50%;display:block}

/* Shorts */
.shorts-section{padding-top:26px}
.shorts-header{height:40px;display:flex;align-items:center;padding:0 var(--inset);gap:10px;position:relative}
.shorts-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.shorts-icon svg{width:32px;height:32px;display:block}
.shorts-title{font-size:20px;font-weight:500;line-height:1;letter-spacing:-.2px}
.shorts-overflow{position:absolute;right:15px;top:50%;transform:translateY(-50%)}
.shorts-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--short-gap);padding:3px var(--inset) 0}
.short-card{aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:8px;background:#1A1A1A}
.short-card img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;background:#1A1A1A}
.short-card-overlay{position:absolute;inset:0;z-index:2}
.short-card-text{position:absolute;left:10px;right:30px;bottom:10px;font-size:clamp(11px,2.5vw,13px);font-weight:400;color:#fff;line-height:17px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.short-card-more{position:absolute;right:7px;top:7px;width:24px;height:24px;border:0;background:rgba(0,0,0,.35);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.short-card-more span{width:3px;height:3px;background:#fff;border-radius:50%}
.short-play{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border:0;background:rgba(0,0,0,.28);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:none}
.short-play svg{width:19px;height:19px;margin-left:2px}
.short-play svg path{stroke:none}.short-play svg .shorts-body{fill:#0F0F0F !important}.short-play svg .shorts-play{fill:#F1F1F1 !important}

/* Bottom navigation */
.bottom-navigation{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);width:100%;max-width:691px;margin:0 auto;background:var(--bg);border-top:1px solid #202020;z-index:100}
.nav-items{height:100%;display:flex;align-items:stretch}
.nav-item{flex:1;min-width:0;border:0;background:transparent;padding:7px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px}
.nav-item.home-active{position:relative}
.nav-item.home-active::before{content:"";position:absolute;top:1px;left:50%;width:86px;height:86px;transform:translateX(-50%);border-radius:50%;background:#050505;z-index:0}
.nav-item.home-active>*{position:relative;z-index:1}
.nav-icon{width:25px;height:25px;flex:0 0 25px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:100%;height:100%;display:block}
.nav-item:nth-child(1) .nav-icon{width:42px;height:40px;flex-basis:42px}
.nav-item:nth-child(1) .nav-icon svg{width:42px;height:40px}
.nav-item:nth-child(4) .nav-icon{width:42px;height:40px;flex-basis:42px}
.nav-item:nth-child(4) .nav-icon svg{width:42px;height:40px}
.home-icon-wrap{position:relative}
.nav-label{font-size:11px;font-weight:400;line-height:1;color:#F1F1F1;white-space:nowrap}
.nav-create-circle{width:48px;height:48px;flex:0 0 48px;margin-top:-6px;background:#2D2D2D;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav-create-circle svg{width:23px;height:23px;display:block}
.nav-profile-avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;overflow:hidden;background:#4A4A4A}
.nav-profile-avatar img{width:100%;height:100%;display:block;object-fit:cover;background:#4A4A4A}

@media(min-width:401px){
  :root{--inset:20px;--header-h:76px;--chips-h:72px;--chip-h:50px;--nav-h:96px;--short-gap:10px}
  .video-meta{gap:13px;padding-top:15px}.channel-avatar{width:52px;height:52px;flex-basis:52px}.meta-text{padding-right:30px}.video-title{font-size:17px;line-height:22px}.video-secondary{font-size:13px;line-height:18px}.shorts-section{padding-top:31px}.shorts-header{height:46px;gap:13px}.shorts-icon{width:36px;height:36px;flex-basis:36px}.shorts-icon svg{width:36px;height:36px}.shorts-title{font-size:23px}.shorts-grid{padding-top:4px}.short-card-text{font-size:clamp(13px,2.2vw,15px);line-height:20px}.nav-icon{width:30px;height:30px;flex-basis:30px}.nav-label{font-size:12px}.nav-create-circle{width:54px;height:54px;flex-basis:54px;margin-top:-8px}.nav-profile-avatar{width:34px;height:34px;flex-basis:34px}
}
@media(max-width:400px){
  .category-scroller{gap:8px}
  .explore-btn{width:52px;height:42px;border-radius:8px}
  .explore-btn svg{width:25px;height:25px}
  .chip{height:42px;font-size:15px;padding:0 13px;border-radius:10px;font-weight:400}
  .chip-all{padding:0 16px;font-weight:500}
  .nav-icon{width:25px;height:25px;flex-basis:25px}
}
.header-icon-btn svg{shape-rendering:geometricPrecision}
.meta-overflow span,.shorts-overflow span{width:3.5px;height:3.5px}
</style>
</head>

<script>
(function(){
  // -------- Canvas placeholder generator --------
  function generatePlaceholder(text, width=1280, height=720, isAvatar=false) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    if (isAvatar) {
      const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width/2);
      gradient.addColorStop(0, '#FF0033');
      gradient.addColorStop(1, '#0F0F0F');
      ctx.fillStyle = gradient;
      ctx.fillRect(0,0,width,height);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${height * 0.5}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text.charAt(0).toUpperCase(), width/2, height/2 + height*0.04);
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    const gradient = ctx.createLinearGradient(0,0,width,height);
    const colors = ['#FF0033', '#1A1A1A', '#0F0F0F'];
    gradient.addColorStop(0, colors[0]);
    gradient.addColorStop(0.4, colors[1]);
    gradient.addColorStop(1, colors[2]);
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,width,height);

    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `bold ${Math.min(width, height) * 0.07}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const words = text.split(' ');
    let lines = [];
    let currentLine = '';
    for (let w of words) {
      const test = currentLine + w + ' ';
      if (ctx.measureText(test).width > width * 0.85) {
        if (currentLine) lines.push(currentLine.trim());
        currentLine = w + ' ';
      } else {
        currentLine = test;
      }
    }
    if (currentLine) lines.push(currentLine.trim());
    if (lines.length === 0) lines = [text];

    const lineHeight = Math.min(width, height) * 0.09;
    const startY = height/2 - (lines.length-1) * lineHeight/2;
    ctx.shadowBlur = 20;
    lines.forEach((line, i) => {
      ctx.fillText(line, width/2, startY + i * lineHeight);
    });
    ctx.shadowBlur = 0;

    return canvas.toDataURL('image/jpeg', 0.8);
  }

  // -------- Data --------
  const videoData = [
    {title:'Green Lantern: Origin of John Stewart', meta:'Comics Explained · 226K views · 2 days ago'},
    {title:'How I Reached 500K Views With YouTube Shorts', meta:'Passive Hustler · 214K views · 2 weeks ago'},
    {title:'YouTube Shorts Algorithm: 7 Things Creators Miss', meta:'Passive Hustler · 98K views · 5 days ago'},
    {title:'I Tested 30 Shorts — Here\'s What Actually Worked', meta:'Passive Hustler · 156K views · 1 month ago'},
    {title:'The Shorts Views Drop: What\'s Really Happening?', meta:'Passive Hustler · 72K views · 4 days ago'},
    {title:'How to Get More Views on Every Short You Post', meta:'Passive Hustler · 301K views · 3 months ago'}
  ];

  const shortTitles = [
    'How much YouTube paid me for 500 million faceless views',
    'Shorts Algorithm Secret 🤔 | 0 Views…',
    '3 Editing Tricks That Make Shorts More Watchable',
    'Why Your First 2 Seconds Matter',
    'Best Shorts Hook Formula?',
    'I Posted 7 Shorts in One Day',
    'Stop Doing This On YouTube Shorts',
    'Small Channel? Try This'
  ];

  // -------- Helpers --------
  function randomIndex(max, avoid=-1) {
    let n = Math.floor(Math.random() * max);
    if (window.crypto && crypto.getRandomValues) {
      const u = new Uint32Array(1);
      crypto.getRandomValues(u);
      n = u[0] % max;
    }
    if (max > 1 && n === avoid) n = (n + 1) % max;
    return n;
  }

  function pickVideo() {
    let last = -1;
    try { last = Number(localStorage.getItem('yt_ui_last_video')); } catch(e) {}
    const idx = randomIndex(videoData.length, Number.isFinite(last) ? last : -1);
    try { localStorage.setItem('yt_ui_last_video', String(idx)); } catch(e) {}
    return { ...videoData[idx], index: idx };
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randomIndex(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // -------- Render --------
  function render() {
    const video = document.getElementById('hero-video');
    const vidInfo = pickVideo();

    // Generate poster
    const posterUrl = generatePlaceholder(vidInfo.title, 1280, 720);
    video.poster = posterUrl;
    video.src = ''; // no actual video, just poster
    video.load();

    document.getElementById('video-title').textContent = vidInfo.title;
    document.getElementById('video-secondary').textContent = vidInfo.meta;

    // Channel avatar
    const avatarImg = document.getElementById('channel-avatar');
    const channelName = vidInfo.title.split(':')[0] || 'Channel';
    avatarImg.src = generatePlaceholder(channelName, 200, 200, true);
    avatarImg.alt = channelName;

    // Profile avatar
    const profileImg = document.getElementById('profile-avatar');
    profileImg.src = generatePlaceholder('You', 200, 200, true);
    profileImg.alt = 'You';

    // Shorts
    const grid = document.getElementById('shorts-grid');
    grid.innerHTML = '';
    const shuffled = shuffleArray([...shortTitles]);
    const selected = shuffled.slice(0, 6);
    selected.forEach(title => {
      const card = document.createElement('article');
      card.className = 'short-card';

      const img = document.createElement('img');
      const thumbUrl = generatePlaceholder(title, 540, 960);
      img.src = thumbUrl;
      img.alt = title;
      card.appendChild(img);

      const overlay = document.createElement('div');
      overlay.className = 'short-card-overlay';

      const more = document.createElement('button');
      more.className = 'short-card-more';
      more.type = 'button';
      more.setAttribute('aria-label', 'More options');
      more.innerHTML = '<span></span><span></span><span></span>';
      overlay.appendChild(more);

      const play = document.createElement('button');
      play.className = 'short-play';
      play.type = 'button';
      play.setAttribute('aria-label', 'Play short');
      play.innerHTML = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path class="shorts-body" d="m18.931 9.99-1.441-.601 1.717-.913a4.48 4.48 0 0 0 1.874-6.078 4.506 4.506 0 0 0-6.09-1.874L4.792 5.929a4.504 4.504 0 0 0-2.402 4.193 4.521 4.521 0 0 0 2.666 3.904c.036.012 1.442.6 1.442.6l-1.706.901a4.51 4.51 0 0 0-2.369 3.967A4.528 4.528 0 0 0 6.93 24c.725 0 1.437-.174 2.08-.508l10.21-5.406a4.494 4.494 0 0 0 2.39-4.192 4.525 4.525 0 0 0-2.678-3.904ZM9.597 15.19V8.824l6.007 3.184z"/><path class="shorts-play" d="M9.597 15.19V8.824l6.007 3.184z"/></svg>`;
      overlay.appendChild(play);

      const text = document.createElement('p');
      text.className = 'short-card-text';
      text.textContent = title;
      overlay.appendChild(text);

      card.appendChild(overlay);
      grid.appendChild(card);
    });
  }

  // -------- Video controls (mock) --------
  const video = document.getElementById('hero-video');
  const timeDisplay = document.getElementById('duration-indicator');
  const progressActive = document.getElementById('progress-active');
  const knob = document.getElementById('progress-knob');
  const track = document.getElementById('progress-track');
  const container = document.getElementById('progress-container');
  const playOverlay = document.getElementById('video-play-overlay');

  let isDragging = false;

  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function updateUI() {
    const current = isFinite(video.currentTime) ? video.currentTime : 0;
    const duration = isFinite(video.duration) && video.duration > 0 ? video.duration : 1;
    const ratio = Math.min(1, current / duration);
    timeDisplay.textContent = formatTime(current);
    progressActive.style.width = (ratio * 100) + '%';
    knob.style.display = ratio > 0 ? 'block' : 'none';
  }

  function setPlayback(percent) {
    const dur = isFinite(video.duration) && video.duration > 0 ? video.duration : 1;
    video.currentTime = Math.min(dur, Math.max(0, percent * dur));
    updateUI();
  }

  // Seek on click
  track.addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    setPlayback(Math.max(0, Math.min(1, x)));
  });

  // Drag knob
  knob.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    isDragging = true;
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    const rect = track.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    setPlayback(Math.max(0, Math.min(1, x)));
  });
  document.addEventListener('mouseup', function() {
    isDragging = false;
    document.body.style.userSelect = '';
  });

  // Touch drag
  knob.addEventListener('touchstart', function(e) {
    e.stopPropagation();
    isDragging = true;
  }, {passive: true});
  document.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    const rect = track.getBoundingClientRect();
    const touch = e.touches[0];
    const x = (touch.clientX - rect.left) / rect.width;
    setPlayback(Math.max(0, Math.min(1, x)));
  }, {passive: true});
  document.addEventListener('touchend', function() {
    isDragging = false;
  }, {passive: true});

  // Timeupdate
  video.addEventListener('timeupdate', updateUI);
  video.addEventListener('loadedmetadata', updateUI);
  video.addEventListener('ended', updateUI);

  // Autoplay fallback
  function attemptAutoplay() {
    playOverlay.classList.remove('show');
    video.muted = true;
    video.defaultMuted = true;
    const p = video.play();
    if (p && p.catch) {
      p.catch(() => {
        playOverlay.classList.add('show');
      });
    }
  }

  playOverlay.addEventListener('click', function() {
    video.muted = false;
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
    playOverlay.classList.remove('show');
  });

  video.addEventListener('play', () => playOverlay.classList.remove('show'));
  video.addEventListener('pause', () => {
    if (video.currentTime > 0 && video.paused) {
      playOverlay.classList.add('show');
    }
  });

  // Initial render & autoplay
  document.addEventListener('DOMContentLoaded', function() {
    render();
    setTimeout(attemptAutoplay, 100);
  });

  // Visibility change – resume if needed
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && video.paused) {
      attemptAutoplay();
    }
  });

  // Keep UI fresh if metadata loads late
  video.addEventListener('durationchange', updateUI);
  video.addEventListener('loadeddata', updateUI);
})();
</script>
</body>
</html>
