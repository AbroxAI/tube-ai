<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YouTube Mobile UI — 1:1 Reference</title>
<style>
:root{
  --bg:#0F0F0F; --chip:#272727; --chip-active:#F1F1F1; --text:#F1F1F1; --muted:#AAAAAA; --red:#FF0033;
  --inset:23px; --header-h:96px; --chips-h:89px; --chip-h:62px; --nav-h:122px; --short-gap:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{
  width:100%; max-width:691px; min-height:100vh; margin:0 auto; overflow-x:hidden;
  background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:calc(var(--nav-h) + 1px); -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}

/* YouTube header only — device status bar intentionally removed. */
.top-header{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 29px;background:var(--bg)}
.youtube-logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.yt-play-mark{width:56px;height:40px;display:block}
.yt-wordmark{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;line-height:1;letter-spacing:-1.2px;white-space:nowrap}
.header-icons{display:flex;align-items:center;gap:22px}
.header-icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.header-icon-btn svg{display:block}

/* Category chips */
.category-scroller{
  height:var(--chips-h);display:flex;align-items:center;gap:15px;padding-left:var(--inset);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none;
}
.category-scroller::-webkit-scrollbar{display:none}
.explore-btn{
  width:81px;height:var(--chip-h);flex:0 0 auto;border:0;border-radius:10px;background:#242424;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.explore-btn svg{width:40px;height:40px;display:block}
.chip{
  height:var(--chip-h);flex:0 0 auto;padding:0 21px;border:0;border-radius:14px;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  font-size:22px;font-weight:400;line-height:1;letter-spacing:.05px;
}
.chip-all{padding:0 26px;background:var(--chip-active);color:#181818;font-weight:500}
.chip-unselected{background:var(--chip);color:#E5E5E5}

/* Reference thumbnails are used so the media content stays visually 1:1. */
.main-video{width:100%;aspect-ratio:691/388;overflow:hidden;background:#1A1A1A}
.main-video img{width:100%;height:100%;display:block;object-fit:cover}

.video-meta{
  display:flex;align-items:flex-start;gap:17px;padding:20px var(--inset) 0;position:relative;
}
.channel-avatar{width:69px;height:69px;flex:0 0 69px;border-radius:50%;overflow:hidden;background:#333}
.channel-avatar img{width:100%;height:100%;display:block;object-fit:cover}
.meta-text{min-width:0;flex:1;padding-right:42px}
.video-title{font-size:21px;font-weight:500;line-height:28px;letter-spacing:.1px;color:var(--text);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.video-secondary{margin-top:6px;font-size:16px;font-weight:400;line-height:21px;color:var(--muted);white-space:nowrap}
.meta-overflow,.shorts-overflow{
  width:28px;height:28px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;opacity:.95;
}
.meta-overflow{position:absolute;right:23px;top:22px}
.meta-overflow span,.shorts-overflow span{width:5px;height:5px;background:#F1F1F1;border-radius:50%;display:block}

/* Shorts */
.shorts-section{padding-top:52px}
.shorts-header{height:57px;display:flex;align-items:center;padding:0 var(--inset);gap:19px;position:relative}
.shorts-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:0 0 48px}
.shorts-icon svg{width:48px;height:48px;display:block}
.shorts-title{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.3px}
.shorts-overflow{position:absolute;right:23px;top:50%;transform:translateY(-50%)}
.shorts-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--short-gap);padding:8px var(--inset) 0}
.short-card{aspect-ratio:316/464;overflow:hidden;border-radius:13px;background:#1A1A1A}
.short-card img{width:100%;height:100%;display:block;object-fit:cover}

/* Bottom navigation — proportions and icon treatment matched to the supplied reference. */
.bottom-navigation{
  position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);width:100%;max-width:691px;margin:0 auto;
  background:var(--bg);border-top:1px solid #2A2A2A;z-index:100;
}
.nav-items{height:100%;display:flex;align-items:stretch}
.nav-item{
  flex:1;min-width:0;border:0;background:transparent;padding:11px 0 0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:6px;
}
.nav-icon{width:37px;height:37px;display:flex;align-items:center;justify-content:center;flex:0 0 37px}
.nav-icon svg{width:100%;height:100%;display:block}
.nav-label{font-size:15px;font-weight:400;line-height:1;color:#F1F1F1;white-space:nowrap;letter-spacing:.05px}
.nav-create-circle{
  width:70px;height:70px;margin-top:-14px;border-radius:50%;background:#2D2D2D;
  display:flex;align-items:center;justify-content:center;flex:0 0 70px;
}
.nav-create-circle svg{width:32px;height:32px;display:block}
.nav-profile-avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:0 0 46px}
.nav-profile-avatar img{width:100%;height:100%;display:block;object-fit:cover}

@media(max-width:400px){
  :root{--inset:16px;--header-h:80px;--chips-h:74px;--chip-h:54px;--nav-h:108px;--short-gap:12px}
  .top-header{padding:0 20px}
  .youtube-logo{gap:7px}.yt-play-mark{width:46px;height:33px}.yt-wordmark{font-size:24px;letter-spacing:-1px}
  .header-icons{gap:14px}.header-icon-btn{width:40px;height:40px}
  .category-scroller{gap:12px}
  .explore-btn{width:81px;height:54px}.explore-btn svg{width:34px;height:34px}
  .chip{font-size:18px;padding:0 16px;border-radius:12px}.chip-all{padding:0 21px}
  .video-meta{gap:14px;padding-top:17px}.channel-avatar{width:56px;height:56px;flex-basis:56px}
  .meta-text{padding-right:35px}.video-title{font-size:17px;line-height:23px}.video-secondary{font-size:14px;line-height:19px}
  .shorts-section{padding-top:42px}.shorts-header{gap:15px;height:50px}.shorts-icon,.shorts-icon svg{width:38px;height:38px}.shorts-icon{flex-basis:38px}.shorts-title{font-size:24px}
  .short-card{border-radius:10px}.nav-icon{width:32px;height:32px;flex-basis:32px}.nav-label{font-size:13px}
  .nav-create-circle{width:60px;height:60px;flex-basis:60px;margin-top:-10px}.nav-create-circle svg{width:30px;height:30px}
  .nav-profile-avatar{width:38px;height:38px;flex-basis:38px}
}
</style>
</head>
