<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>YouTube Mobile UI</title>

<style>
:root{
  --bg:#0F0F0F;
  --text:#F1F1F1;
  --muted:#AAAAAA;
  --red:#FF0033;
  --chip:#272727;
}

*{margin:0;padding:0;box-sizing:border-box}

html{
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  scrollbar-width:none;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar,
.category-scroller::-webkit-scrollbar{
  width:0;height:0;display:none;
}

body{
  width:100%;
  max-width:691px;
  min-height:100vh;
  margin:0 auto;
  overflow-x:hidden;
  overflow-y:auto;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:75px;
  scrollbar-width:none;
  -webkit-tap-highlight-color:transparent;
}

button{font:inherit;color:inherit;cursor:pointer}

/* =========================
   LOADING SCREEN — MERGED
   Reference sequence:
   white YouTube splash -> dark transition ->
   centered YouTube mark + progress bar -> app
   ========================= */
#yt-loading-screen{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transition:opacity .20s ease,visibility .20s ease;
}

body.is-loading{
  overflow:hidden;
}

body.is-loading > :not(#yt-loading-screen){
  visibility:hidden;
}

#yt-loading-screen.is-dark{
  background:#0F0F0F;
}

.yt-loader-logo{
  position:absolute;
  left:50%;
  top:50%;
  width:84px;
  height:auto;
  transform:translate(-50%,-50%);
  opacity:1;
  transition:width .25s ease,opacity .18s ease;
}

#yt-loading-screen.is-dark .yt-loader-logo{
  width:62px;
}

/* Slightly bolder loading mark without changing the reference artwork. */
.yt-loader-logo path:first-child{
  stroke:#FF0033;
  stroke-width:.7;
  paint-order:stroke fill;
}
.yt-loader-logo path:last-child{
  stroke:#fff;
  stroke-width:.35;
  paint-order:stroke fill;
}


.yt-loader-progress{
  position:absolute;
  left:50%;
  top:50%;
  width:120px;
  height:3px;
  transform:translate(-50%,-50%);
  opacity:0;
  display:flex;
  align-items:center;
  gap:6px;
}

.yt-loader-progress-play{
  width:11px;
  height:13px;
  flex:0 0 11px;
  background:#F1F1F1;
  clip-path:polygon(0 0,100% 50%,0 100%);
}

.yt-loader-progress-track{
  position:relative;
  flex:1;
  height:2px;
  background:#A8A8A8;
  overflow:hidden;
  border-radius:1px;
}

.yt-loader-progress-active{
  width:16%;
  height:100%;
  background:#FF0033;
  border-radius:1px;
}

#yt-loading-screen.is-progress .yt-loader-progress-active{
  animation:ytLoaderProgress 4s cubic-bezier(.33,1,.68,1) forwards;
}

@keyframes ytLoaderProgress{
  0%{width:10%;}
  18%{width:24%;}
  45%{width:41%;}
  72%{width:56%;}
  100%{width:68%;}
}

#yt-loading-screen.is-progress .yt-loader-progress{
  opacity:1;
}

#yt-loading-screen.is-progress .yt-loader-logo{
  width:0;
  opacity:0;
}


#yt-loading-screen.is-complete{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* =========================
   HIDDEN HOME SCREEN SUPPORT
   ========================= */

.top-header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:var(--bg);
}

.youtube-logo{
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

.yt-play-mark{width:46px;height:33px;display:block}

.yt-wordmark{
  font-family:Arial,Helvetica,sans-serif;
  font-size:26px;
  font-weight:700;
  line-height:1;
  letter-spacing:-1px;
  white-space:nowrap;
}

.header-icons{
  display:flex;
  align-items:center;
  gap:12px;
}

.header-icon-btn{
  width:36px;
  height:36px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.header-icon-btn svg{
  width:30px;
  height:30px;
  display:block;
}

.category-scroller{
  height:76px;
  display:flex;
  align-items:center;
  gap:10px;
  padding-left:20px;
  padding-right:0;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  scrollbar-width:none;
}

.explore-btn{
  width:62px;
  height:50px;
  flex:0 0 auto;
  border:0;
  border-radius:9px;
  background:#242424;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.explore-btn svg{width:29px;height:29px}

.chip{
  height:42px;
  flex:0 0 auto;
  padding:0 13px;
  border:0;
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  font-size:15px;
  font-weight:400;
}

.chip-all{
  padding:0 16px;
  background:#F1F1F1;
  color:#181818;
  font-weight:500;
}

.chip-unselected{
  background:var(--chip);
  color:#E5E5E5;
}

.main-video{
  width:100%;
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  background:#1A1A1A;
}

.main-video video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  background:#1A1A1A;
}

.video-overlays{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.video-overlays > *{pointer-events:auto}

.mute-icon{
  position:absolute;
  top:15px;
  right:15px;
  width:72px;
  height:72px;
  background:#3A3A3A;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mute-icon svg{width:45px;height:46px;display:block}

.cc-control{
  position:absolute;
  top:104px;
  right:15px;
  width:72px;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#3A3A3A;
  border-radius:50%;
  font-size:0;
}

.cc-control::before{
  content:"CC";
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:32px;
  background:#F1F1F1;
  color:#666;
  border-radius:4px;
  font-size:13px;
  font-weight:600;
}

.subtitle-overlay{
  position:absolute;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  padding:5px 14px 6px;
  background:rgba(0,0,0,.82);
  border-radius:4px;
  color:#fff;
  font-size:14px;
  font-weight:500;
  line-height:20px;
  white-space:nowrap;
}

.duration-indicator{
  position:absolute;
  right:10px;
  bottom:14px;
  padding:5px 7px;
  background:rgba(0,0,0,.84);
  border-radius:4px;
  color:#fff;
  font-size:12px;
  font-weight:400;
}

.progress-container{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:19px;
  display:flex;
  align-items:flex-end;
}

.progress-track{
  width:100%;
  height:4px;
  position:relative;
  background:rgba(255,255,255,.22);
}

.progress-active{
  width:0%;
  height:100%;
  position:relative;
  background:var(--red);
}

.progress-knob{
  position:absolute;
  top:50%;
  right:-7px;
  width:14px;
  height:14px;
  transform:translateY(-50%);
  background:var(--red);
  border-radius:50%;
}

.video-meta{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:12px 20px 0;
  position:relative;
}

.channel-avatar{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:50%;
  overflow:hidden;
  background:#3A3A3A;
}

.channel-avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.meta-text{
  min-width:0;
  flex:1;
  padding-right:26px;
}

.video-title{
  font-size:15px;
  line-height:19px;
  font-weight:400;
  color:var(--text);
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
}

.video-secondary{
  font-size:12px;
  line-height:16px;
  margin-top:3px;
  color:var(--muted);
}

.meta-overflow,
.shorts-overflow{
  width:24px;
  height:24px;
  border:0;
  background:transparent;
  padding:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.meta-overflow{
  position:absolute;
  right:15px;
  top:14px;
}

.meta-overflow span,
.shorts-overflow span{
  width:3.5px;
  height:3.5px;
  background:#F1F1F1;
  border-radius:50%;
  display:block;
}

.shorts-section{padding-top:30px}

.shorts-header{
  height:44px;
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:11px;
  position:relative;
}

.shorts-icon{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 32px;
}

.shorts-icon svg{
  width:32px;
  height:32px;
  display:block;
}

.shorts-title{
  font-family:Arial,Helvetica,sans-serif;
  font-size:20px;
  font-weight:700;
}

.shorts-overflow{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
}

.shorts-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:4px 20px 0;
}

.short-card{
  aspect-ratio:9/16;
  position:relative;
  overflow:hidden;
  border-radius:8px;
  background:#1A1A1A;
}

.short-card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.short-card-placeholder{
  position:absolute;
  inset:0;
  background:#181818;
}

.short-card-overlay{
  position:absolute;
  inset:0;
  z-index:2;
}

.short-card-text{
  position:absolute;
  left:10px;
  right:30px;
  bottom:10px;
  font-size:13px;
  line-height:17px;
  font-weight:400;
  color:#fff;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
}

.short-card-more{
  position:absolute;
  right:7px;
  top:7px;
  width:24px;
  height:24px;
  border:0;
  background:rgba(0,0,0,.35);
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}

.short-card-more span{
  width:3px;
  height:3px;
  background:#fff;
  border-radius:50%;
}

.short-play{
  position:absolute;
  left:50%;
  top:50%;
  width:34px;
  height:34px;
  transform:translate(-50%,-50%);
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
}

.short-play svg{
  width:19px;
  height:19px;
  margin-left:2px;
}

/* Mobile home sizing */
@media(max-width:430px){
  .top-header{
    height:48px;
    padding:0 18px;
  }

  .youtube-logo{gap:4px}
  .yt-play-mark{width:32px;height:23px}
  .yt-wordmark{font-size:21px;letter-spacing:-.7px}
  .header-icons{gap:8px}
  .header-icon-btn{width:30px;height:30px}
  .header-icon-btn svg{width:22px;height:22px}

  .category-scroller{
    height:56px;
    gap:7px;
    padding-left:20px;
    padding-right:10px;
  }

  .explore-btn{
    width:46px;
    height:36px;
  }

  .explore-btn svg{width:23px;height:23px}

  .chip{
    height:36px;
    padding:0 12px;
    font-size:14px;
  }

  .chip-all{padding:0 14px}

  .mute-icon{
    top:8px;
    right:10px;
    width:30px;
    height:30px;
    background:transparent;
    border-radius:0;
  }

  .mute-icon svg{width:22px;height:23px}

  .cc-control{
    top:48px;
    right:10px;
    width:30px;
    height:30px;
    background:transparent;
    border-radius:0;
  }

  .cc-control::before{
    width:24px;
    height:20px;
    font-size:10px;
  }

  .video-meta{
    gap:10px;
    padding:10px 20px 0;
  }

  .channel-avatar{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

  .meta-text{padding-right:22px}

  .video-title{
    font-size:15px;
    line-height:19px;
  }

  .video-secondary{
    font-size:12px;
    line-height:16px;
    margin-top:2px;
  }

  .shorts-section{padding-top:27px}

  .shorts-header{
    height:40px;
    padding:0 20px;
    gap:10px;
  }

  .shorts-icon{
    width:30px;
    height:30px;
    flex-basis:30px;
  }

  .shorts-icon svg{
    width:30px;
    height:30px;
  }

  .shorts-title{
    font-size:20px;
    line-height:1;
  }

  .shorts-grid{
    gap:8px;
    padding:4px 20px 0;
  }

  .main-video{overflow:visible}
  .progress-container{overflow:visible}
  .progress-track,
  .progress-active{overflow:visible}
}
/* =========================
   BOTTOM NAVIGATION
   ========================= */

.bottom-navigation{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  width:100%;
  max-width:691px;
  margin:0 auto;
  background:var(--bg);
  border-top:1px solid #202020;
  z-index:100;
  padding-bottom:0;
}

.nav-items{
  height:100%;
  display:flex;
  align-items:stretch;
}

.nav-item{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  padding:4px 0 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:3px;
  text-decoration:none;
  color:inherit;
}

.nav-item.home-active{position:relative}

.nav-item.home-active::before{
  content:"";
  position:absolute;
  top:-1px;
  left:50%;
  width:50px;
  height:50px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#050505;
  z-index:0;
}

.nav-item.home-active > *{
  position:relative;
  z-index:1;
}

.nav-icon{
  width:27px;
  height:27px;
  flex:0 0 27px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-icon svg{
  width:27px;
  height:27px;
  display:block;
}

/* Shorts bottom nav — unchanged artwork */
.nav-item:nth-child(2) .nav-icon{
  width:27px;
  height:27px;
  flex-basis:27px;
}

.nav-item:nth-child(2) .nav-icon svg{
  width:24px;
  height:24px;
  display:block;
}

.nav-item:nth-child(2) .nav-icon svg path:first-child{
  stroke-width:1.35;
}

.nav-label{
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  font-weight:400;
  line-height:1.05;
  color:#F1F1F1;
  white-space:nowrap;
}

.nav-create-circle{
  width:40px;
  height:40px;
  flex:0 0 40px;
  margin-top:-2px;
  background:#2D2D2D;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-create-circle svg{
  width:20px;
  height:20px;
  display:block;
}

.nav-profile-avatar{
  width:24px;
  height:24px;
  flex:0 0 24px;
  margin-top:0;
  border-radius:50%;
  overflow:hidden;
  background:#4A4A4A;
}

.nav-profile-avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  background:#4A4A4A;
}

body.profile-mode .nav-item[aria-label="You"] .nav-profile-avatar{
  border:2px solid #F1F1F1;
}

  }

  }

</style>
</head>

<script>
const videoOptions = [
  {
    title:"Harry Potter and the Philosopher's...",
    meta:'@harrypotter and 2 more · 112K likes · 3.9M views',
    image:'assets/video-01.jpg',
    video:'assets/harry-potter.mp4',
    avatar:'assets/harry-potter-avatar.jpg',
    subtitle:''
  },
  {
    title:'Green Lantern: Origin of John Stewart',
    meta:'Comics Explained · 226K views · 2 days ago',
    image:'assets/video-01.jpg',
    video:'assets/video-01.mp4',
    avatar:'assets/channel-avatar.jpg',
    subtitle:'Never miss a moment'
  }
];

// Main-video logic: exactly two fixed channels.
// First visit: either Harry Potter or Green Lantern.
// Every later fresh load/return: switch to the other one.
const VIDEO_STATE_KEY = 'yt_ui_video_index_v2';

// Shorts images are permanently fixed to these asset paths.
// Only the displayed text rotates on each fresh load/return.
const shortCards = Object.freeze([
  Object.freeze({image:'assets/short-01.jpg'}),
  Object.freeze({image:'assets/short-02.jpg'}),
  Object.freeze({image:'assets/short-03.jpg'}),
  Object.freeze({image:'assets/short-04.jpg'}),
  Object.freeze({image:'assets/short-05.jpg'}),
  Object.freeze({image:'assets/short-06.jpg'})
]);

const shortTextOptions = [
  'How much YouTube paid me for 500 million faceless views',
  'Shorts Algorithm Secret 🤔 | 0 Views…',
  '3 Editing Tricks That Make Shorts More Watchable',
  'Why Your First 2 Seconds Matter',
  'Best Shorts Hook Formula?',
  'I Posted 7 Shorts in One Day',
  'Stop Doing This On YouTube Shorts',
  'Small Channel? Try This'
];

let currentVideoIndex = 0;
let shortTextOffset = 0;
let homeStateInitialized = false;

function getNextVideoIndex(){
  try{
    const saved = Number(localStorage.getItem(VIDEO_STATE_KEY));
    if(Number.isInteger(saved) && saved >= 0 && saved < videoOptions.length){
      return (saved + 1) % videoOptions.length;
    }
  }catch(e){}
  return Math.floor(Math.random() * 2);
}

function saveVideoIndex(index){
  try{ localStorage.setItem(VIDEO_STATE_KEY,String(index)); }catch(e){}
}

function getSavedShortTextOffset(){
  try{
    const saved = Number(localStorage.getItem('yt_ui_short_text_offset'));
    return Number.isFinite(saved)
      ? ((saved % shortTextOptions.length) + shortTextOptions.length) % shortTextOptions.length
      : 0;
  }catch(e){
    return 0;
  }
}

function saveShortTextOffset(offset){
  try{ localStorage.setItem('yt_ui_short_text_offset',String(offset)); }catch(e){}
}

function setHeroVideo(index){
  currentVideoIndex = ((index % videoOptions.length) + videoOptions.length) % videoOptions.length;
  saveVideoIndex(currentVideoIndex);

  const videoData = videoOptions[currentVideoIndex];
  const hero = document.getElementById('hero-video');
  const title = document.getElementById('video-title');
  const secondary = document.getElementById('video-secondary');
  const avatar = document.getElementById('channel-avatar');
  const subtitle = document.getElementById('subtitle-overlay');

  hero.pause();
  hero.poster = videoData.image;
  hero.src = videoData.video;
  hero.muted = true;
  hero.autoplay = true;
  hero.playsInline = true;

  title.textContent = videoData.title;
  secondary.textContent = videoData.meta;

  if(avatar){
    avatar.src = videoData.avatar;
    avatar.alt = videoData.meta.split(' · ')[0];
  }

  if(subtitle){
    subtitle.textContent = videoData.subtitle;
    subtitle.style.display = videoData.subtitle ? 'block' : 'none';
  }

  const duration = document.getElementById('duration-indicator');
  const progress = document.querySelector('.progress-active');
  const knob = document.querySelector('.progress-knob');
  if(duration) duration.textContent = '0:00';
  if(progress) progress.style.width = '0%';
  if(knob) knob.style.display = 'none';

  hero.load();
  const playPromise = hero.play();
  if(playPromise && typeof playPromise.catch === 'function') playPromise.catch(()=>{});
}

function makeShortCard(item,index){
  const card = document.createElement('article');
  card.className = 'short-card';
  card.dataset.shortIndex = String(index);

  const placeholder = document.createElement('div');
  placeholder.className = 'short-card-placeholder';
  card.appendChild(placeholder);

  const img = document.createElement('img');
  img.src = item.image;
  img.alt = '';
  img.addEventListener('error',()=>{img.style.display='none';});
  card.appendChild(img);

  const overlay = document.createElement('div');
  overlay.className = 'short-card-overlay';

  const more = document.createElement('button');
  more.className = 'short-card-more';
  more.type = 'button';
  more.setAttribute('aria-label','More options');
  more.innerHTML = '<span></span><span></span><span></span>';
  overlay.appendChild(more);

  const play = document.createElement('button');
  play.className = 'short-play';
  play.type = 'button';
  play.setAttribute('aria-label','Play short');
  play.innerHTML = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path class="shorts-body"
      d="m18.931 9.99-1.441-.601 1.717-.913a4.48 4.48 0 0 0 1.874-6.078 4.506 4.506 0 0 0-6.09-1.874L4.792 5.929a4.504 4.504 0 0 0-2.402 4.193 4.521 4.521 0 0 0 2.666 3.904c.036.012 1.442.6 1.442.6l-1.706.901a4.51 4.51 0 0 0-2.369 3.967A4.528 4.528 0 0 0 6.93 24c.725 0 1.437-.174 2.08-.508l10.21-5.406a4.494 4.494 0 0 0 2.39-4.192 4.525 4.525 0 0 0-2.678-3.904Z"
      fill="#F1F1F1"/>
    <path class="shorts-play"
      d="M9.597 15.19V8.824l6.007 3.184z"
      fill="#0F0F0F"/>
  </svg>`;
  overlay.appendChild(play);

  const title = document.createElement('p');
  title.className = 'short-card-text';
  overlay.appendChild(title);

  card.appendChild(overlay);
  return card;
}

function updateShortTexts(){
  const textNodes = document.querySelectorAll('.short-card-text');
  textNodes.forEach((node,index)=>{
    node.textContent = shortTextOptions[(shortTextOffset + index) % shortTextOptions.length];
  });
  shortTextOffset = (shortTextOffset + 1) % shortTextOptions.length;
}

function renderShorts(){
  const grid = document.getElementById('shorts-grid');
  grid.innerHTML = '';
  shortCards.forEach((item,index)=>{
    grid.appendChild(makeShortCard(item,index));
  });
  shortTextOffset = getSavedShortTextOffset();
  updateShortTexts();
  saveShortTextOffset(shortTextOffset);
}

function advanceHomeState(){
  if(homeStateInitialized) return;
  homeStateInitialized = true;
  setHeroVideo(getNextVideoIndex());
  renderShorts();
}

document.addEventListener('DOMContentLoaded',function(){
  advanceHomeState();
});

// Browser back/forward can restore index.html from the back-forward cache
// without firing DOMContentLoaded. Advance the same two-video state there.
window.addEventListener('pageshow',function(event){
  if(event.persisted){
    advanceHomeState();
  }
});
</script>

<script>
(function(){
  const video=document.getElementById('hero-video');
  const timeDisplay=document.getElementById('duration-indicator');
  const progress=document.querySelector('.progress-active');
  const knob=document.querySelector('.progress-knob');

  function formatTime(totalSeconds){
    const seconds=Math.max(0,Math.floor(totalSeconds));
    const minutes=Math.floor(seconds/60);
    const secs=seconds%60;
    return minutes+':'+String(secs).padStart(2,'0');
  }

  function updatePlaybackUI(){
    const current=Number.isFinite(video.currentTime)
      ? Math.max(0,video.currentTime)
      : 0;

    const duration=Number.isFinite(video.duration) && video.duration>0
      ? video.duration
      : 0;

    const ratio=duration>0
      ? Math.min(1,current/duration)
      : 0;

    timeDisplay.textContent=formatTime(current);
    progress.style.width=(ratio*100)+'%';

    if(knob){
      knob.style.right='-7px';
      knob.style.display=ratio>0?'block':'none';
    }
  }

  function startMutedAutoplay(){
    video.muted=true;
    video.defaultMuted=true;
    video.autoplay=true;
    video.playsInline=true;

    const playAttempt=video.play();
    if(playAttempt && typeof playAttempt.catch==='function'){
      playAttempt.catch(function(){});
    }
  }

  video.addEventListener('loadedmetadata',updatePlaybackUI);
  video.addEventListener('timeupdate',updatePlaybackUI);
  video.addEventListener('play',updatePlaybackUI);
  video.addEventListener('pause',updatePlaybackUI);
  video.addEventListener('ended',updatePlaybackUI);

  updatePlaybackUI();
  startMutedAutoplay();

  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && video.paused){
      startMutedAutoplay();
    }
  });
})();
</script>

<script>
/* Loading-screen sequencing — only affects the new splash overlay. */
(function(){
  const loader=document.getElementById('yt-loading-screen');
  if(!loader) return;

  function showDarkStage(){
    loader.classList.add('is-dark');
  }

  function showProgressStage(){
    loader.classList.add('is-progress');
  }

  function finishLoading(){
    loader.classList.add('is-complete');
    document.body.classList.remove('is-loading');
    window.setTimeout(function(){
      loader.remove();
    },240);
  }

  // Fast, smooth sequence: brief white splash -> dark stage -> 4-second progress -> app.
  window.setTimeout(showDarkStage,220);
  window.setTimeout(showProgressStage,420);
  window.setTimeout(finishLoading,4420);
})();
</script>
