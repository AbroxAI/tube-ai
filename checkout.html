<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KONG: TWIN BLADES — YouTube Channel</title>
<style>
:root{--bg:#0f0f0f;--panel:#212121;--panel2:#2a2a2a;--text:#f1f1f1;--muted:#a8a8a8;--line:#2b2b2b;--red:#ff0033}
*{box-sizing:border-box;margin:0;padding:0}
html{width:100%;min-height:100%;background:var(--bg);scrollbar-width:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
html::-webkit-scrollbar{width:0;height:0;display:none}
body{width:100%;max-width:360px;min-height:100vh;margin:0 auto;overflow-x:hidden;overflow-y:auto;padding-bottom:72px;background:var(--bg);color:var(--text);font-family:Roboto,Arial,Helvetica,sans-serif;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
body::-webkit-scrollbar{width:0;height:0;display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
main{width:100%}
.topbar{height:55px;padding:0 15px;display:flex;align-items:center;justify-content:space-between}
.topbar-left,.topbar-right{display:flex;align-items:center}
.icon-btn{width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0}
.topbar-left .icon-btn svg{width:20px;height:20px;display:block}
.topbar-right{gap:29px}
.topbar-right .icon-btn:first-child svg{width:22px;height:22px;display:block}
.topbar-right .icon-btn:last-child svg{width:16px;height:16px;display:block}
.banner-wrap{padding:0 15px}
.banner-placeholder{width:100%;aspect-ratio:631/174;border-radius:5px;display:block;background:#202020 center/cover no-repeat url('assets/banner.jpg')}
.banner-placeholder[data-empty="1"]{background-image:none}
.channel{display:grid;grid-template-columns:72px 1fr;gap:16px;padding:12px 15px 12px;align-items:start}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;border:1px solid #3f3f3f;background:#2b2b2b;margin-top:8px}
.channel-copy{min-width:0}
.channel-name{font-size:22px;line-height:1.08;font-weight:650;letter-spacing:-.35px;margin:0 0 6px}
.handle{font-size:12px;line-height:1.15;color:#f1f1f1;margin-bottom:9px}
.subscribers{display:flex;align-items:center;gap:3px;font-size:11px;line-height:1;color:#8f8f8f}
.sub-avatars{display:flex;align-items:center}
.sub-avatars span{display:block;width:10px;height:10px;border-radius:50%;border:1px solid var(--bg);margin-left:-2px;background:#3d3d3d center/cover no-repeat}
.sub-avatars span:first-child{margin-left:0;background-image:url('assets/subscriber_1.jpg');background-color:#e9367d}
.sub-avatars span:nth-child(2){background-image:url('assets/subscriber_2.jpg');background-color:#4f3d3a}
.sub-avatars span:nth-child(3){background-image:url('assets/subscriber_3.jpg');background-color:#d7d7d7}
.sub-chevron{width:5px;height:5px;border-right:1px solid #ddd;border-top:1px solid #ddd;transform:rotate(45deg);margin-left:1px}
.description{padding:8px 15px 0;color:#9f9f9f;font-size:10px;line-height:1.35;display:block;overflow:hidden;max-height:42px}
.description-text{color:#f1f1f1;font-weight:400}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px 15px 0}
.action{height:40px;border-radius:20px;background:#292929;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500}
.action svg{width:20px;height:20px;display:block}
.tabs{margin-top:29px;border-bottom:1px solid #2a2a2a;height:30px;display:flex;align-items:flex-end;padding:0 15px;gap:25px}
.tab{height:30px;display:flex;align-items:center;position:relative;font-size:15px;font-weight:400;color:#a9a9a9}
.tab.active{color:#f1f1f1;font-weight:400}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;border-radius:1px;background:#f1f1f1}
.filters{height:56px;display:flex;align-items:center;gap:8px;padding:0 15px;border-bottom:1px solid #1f1f1f}
.filter{height:32px;padding:0 12px;border-radius:6px;background:#242424;font-size:12px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.filter.active{background:#f1f1f1;color:#111}
.shorts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#0f0f0f}
.card{position:relative;aspect-ratio:231/383;background:#272727;overflow:hidden}
.card img{width:100%;height:100%;display:block;object-fit:cover;background:#272727}
.asset-fill{position:absolute;inset:0;background:#272727 center/cover no-repeat}
.asset-fill.cover-01{background-image:url('assets/short_1.jpg')}
.asset-fill.cover-02{background-image:url('assets/short_2.jpg')}
.asset-fill.cover-03{background-image:url('assets/short_3.jpg')}
.asset-fill.cover-04{background-image:url('assets/short_4.jpg')}
.asset-fill.cover-05{background-image:url('assets/short_5.jpg')}
.drafts{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.drafts svg{width:21px;height:21px;margin-bottom:35px}
.drafts .draft-label{position:absolute;left:8px;bottom:6px;font-size:10px}
.bottom-navigation{position:fixed;left:0;right:0;bottom:0;height:72px;width:100%;max-width:691px;margin:0 auto;background:var(--bg);border-top:1px solid #202020;z-index:100;padding-bottom:0;box-sizing:border-box}
.nav-items{height:100%;display:flex;align-items:stretch}
.nav-item{flex:1;min-width:0;border:0;background:transparent;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;text-decoration:none;color:inherit}
.nav-item.home-active{position:relative}
.nav-item.home-active::before{content:"";position:absolute;top:-1px;left:50%;width:50px;height:50px;transform:translateX(-50%);border-radius:50%;background:#050505;z-index:0}
.nav-item.home-active > *{position:relative;z-index:1}
.nav-icon{width:27px;height:27px;flex:0 0 27px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:27px;height:27px;display:block}
.nav-item:nth-child(2) .nav-icon{width:27px;height:27px;flex-basis:27px}
.nav-item:nth-child(2) .nav-icon svg{width:24px;height:24px;display:block}
.nav-item:nth-child(2) .nav-icon svg path:first-child{stroke-width:1.35}
.nav-label{font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:400;line-height:1.05;color:#F1F1F1;white-space:nowrap}
.nav-create-circle{width:40px;height:40px;flex:0 0 40px;margin-top:-2px;background:#2D2D2D;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav-create-circle svg{width:20px;height:20px;display:block}
.nav-profile-avatar{width:24px;height:24px;flex:0 0 24px;margin-top:0;border-radius:50%;overflow:hidden;background:#4A4A4A}
.nav-profile-avatar img{width:100%;height:100%;display:block;object-fit:cover;background:#4A4A4A}
</style>
</head>
<body>
<main>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" type="button" aria-label="Back" onclick="window.history.back();">
        <svg viewBox="0 0 40 40" fill="none"><path d="M24 8L10 20L24 32" stroke="#F1F1F1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 20H32" stroke="#F1F1F1" stroke-width="2.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" aria-label="Search"><svg viewBox="0 0 40 40" fill="none"><circle cx="18" cy="18" r="11.5" stroke="#F1F1F1" stroke-width="2.6"/><path d="M26.5 26.5L34 34" stroke="#F1F1F1" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" aria-label="More"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="9" r="2.4" fill="#F1F1F1"/><circle cx="20" cy="20" r="2.4" fill="#F1F1F1"/><circle cx="20" cy="31" r="2.4" fill="#F1F1F1"/></svg></button>
    </div>
  </header>

  <div class="banner-wrap"><div class="banner-placeholder" role="img" aria-label="Channel cover placeholder"></div></div>

  <section class="channel">
    <img class="avatar" src="assets/kong-channel-logo.jpg" alt="KONG: TWIN BLADES" onerror="this.style.visibility='hidden'">
    <div class="channel-copy">
      <h1 class="channel-name">KONG: TWIN BLADES</h1>
      <p class="handle">@apexstudios</p>
      <div class="subscribers">
        <div class="sub-avatars" aria-label="Subscriber avatars placeholders"><span></span><span></span><span></span></div>
        <span>21.4M subscribers</span><span class="sub-chevron"></span>
      </div>
    </div>
  </section>

  <div class="description" aria-label="Channel description preview"><span class="description-text">blood-soaked war between titans. New content drops here. Turn on notifications if you dare....more</span></div>

  <section class="actions">
    <button class="action" aria-label="Analytics">
      <svg viewBox="0 0 44 44" fill="none"><rect x="7" y="7" width="30" height="30" rx="2.5" stroke="#F1F1F1" stroke-width="3"/><path d="M14 31V22" stroke="#F1F1F1" stroke-width="3" stroke-linecap="round"/><path d="M22 31V15" stroke="#F1F1F1" stroke-width="3" stroke-linecap="round"/><path d="M30 31V19" stroke="#F1F1F1" stroke-width="3" stroke-linecap="round"/></svg>
      Analytics
    </button>
    <button class="action" aria-label="Edit Channel">
      <svg viewBox="0 0 44 44" fill="none"><path d="M9 35L12.7 24.4L29.2 7.9C31.5 5.6 35.2 5.6 37.5 7.9C39.8 10.2 39.8 13.9 37.5 16.2L21 32.7L9 35Z" stroke="#F1F1F1" stroke-width="3" stroke-linejoin="round"/><path d="M26.6 10.5L33.5 17.4" stroke="#F1F1F1" stroke-width="3" stroke-linecap="round"/></svg>
      Edit Channel
    </button>
  </section>

  <div class="tabs" role="tablist" aria-label="Channel content">
    <button class="tab active" type="button" role="tab" aria-selected="true">Shorts</button>
    <button class="tab" type="button" role="tab" aria-selected="false">Posts</button>
  </div>

  <div class="filters">
    <button class="filter active">Latest</button>
    <button class="filter">Popular</button>
    <button class="filter">Oldest</button>
  </div>

  <section class="shorts-grid" aria-label="Shorts">
    <article class="card drafts">
      <svg viewBox="0 0 44 44" fill="none"><path d="M11 7H27L35 15V37H11V7Z" stroke="#F1F1F1" stroke-width="3" stroke-linejoin="round"/><path d="M27 7V16H35" stroke="#F1F1F1" stroke-width="3" stroke-linejoin="round"/></svg>
      <span class="draft-label">Drafts</span>
    </article>
    <article class="card"><div class="asset-fill cover-01" role="img" aria-label="Short 1 asset placeholder"></div></article>
    <article class="card"><div class="asset-fill cover-02" role="img" aria-label="Short 2 asset placeholder"></div></article>
    <article class="card"><div class="asset-fill cover-03" role="img" aria-label="Short 3 asset placeholder"></div></article>
    <article class="card"><div class="asset-fill cover-04" role="img" aria-label="Short 4 asset placeholder"></div></article>
    <article class="card"><div class="asset-fill cover-05" role="img" aria-label="Short 5 asset placeholder"></div></article>
  </section>
</main>

<nav class="bottom-navigation" aria-label="Bottom navigation">
  <div class="nav-items">
    <button class="nav-item home-active" type="button" aria-label="Home">
      <div class="nav-icon home-icon-wrap">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M4.5 15.5L24 2.5L43.5 15.5L40.5 15.5V37.5Q40.5 40 38 40H29V25.5Q29 23 26.5 23H21.5Q19 23 19 25.5V40H10Q7.5 40 7.5 37.5V15.5H4.5Z" fill="none" stroke="#F1F1F1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div><span class="nav-label">Home</span>
    </button>

    <button class="nav-item" type="button" aria-label="Shorts">
      <div class="nav-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m18.931 9.99-1.441-.601 1.717-.913a4.48 4.48 0 0 0 1.874-6.078 4.506 4.506 0 0 0-6.09-1.874L4.792 5.929a4.504 4.504 0 0 0-2.402 4.193 4.521 4.521 0 0 0 2.666 3.904c.036.012 1.442.6 1.442.6l-1.706.901a4.51 4.51 0 0 0-2.369 3.967A4.528 4.528 0 0 0 6.93 24c.725 0 1.437-.174 2.08-.508l10.21-5.406a4.494 4.494 0 0 0 2.39-4.192 4.525 4.525 0 0 0-2.678-3.904Z" fill="#0F0F0F" stroke="#F1F1F1" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.597 15.19V8.824l6.007 3.184z" fill="#F1F1F1"/></svg></div><span class="nav-label">Shorts</span>
    </button>

    <button class="nav-item" type="button" aria-label="Create"><div class="nav-create-circle"><svg viewBox="0 0 32 32" fill="none"><path d="M16 5V27M5 16H27" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></div></button>

    <button class="nav-item" type="button" aria-label="Subscriptions">
      <div class="nav-icon"><svg viewBox="0 0 42 40" fill="none" aria-hidden="true"><path d="M14.5 7H27.5" stroke="#F1F1F1" stroke-width="2" stroke-linecap="round"/><rect x="2" y="12" width="38" height="26" rx="2.5" stroke="#F1F1F1" stroke-width="2"/><path d="M14.5 18.5L24 25L14.5 31.5V18.5Z" fill="#F1F1F1"/><circle cx="36" cy="11.5" r="6.5" fill="#FF0033"/></svg></div><span class="nav-label">Subscriptions</span>
    </button>

    <a id="profile-nav" class="nav-item" href="profile.html" aria-label="You" data-profile-target="profile.html"><div class="nav-profile-avatar"><img id="profile-avatar" src="./assets/profile.jpg" alt="Profile" loading="eager" decoding="async" onerror="if(this.src.endsWith('/assets/profile.jpg')){this.src='./profile.jpg';}"></div><span class="nav-label">You</span></a>
  </div>
</nav>
</body>
</html>
