<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Check Profile — YouTube Reference</title>
<style>
:root{
  --bg:#0f0f0f;
  --panel:#212121;
  --panel2:#2a2a2a;
  --text:#f1f1f1;
  --muted:#a8a8a8;
  --line:#2b2b2b;
  --red:#ff0033;
}

*{box-sizing:border-box;margin:0;padding:0}
html{
  width:100%;
  min-height:100%;
  background:var(--bg);
  scrollbar-width:none;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
html::-webkit-scrollbar{width:0;height:0;display:none}
body{
  width:100%;
  max-width:360px;
  min-height:100vh;
  margin:0 auto;
  overflow-x:hidden;
  overflow-y:auto;
  padding-bottom:72px;
  background:var(--bg);
  color:var(--text);
  font-family:Roboto,Arial,Helvetica,sans-serif;
  scrollbar-width:none;
  -webkit-tap-highlight-color:transparent;
}
body::-webkit-scrollbar{width:0;height:0;display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
main{width:100%;}

/* =========================
   CHECKOUT / CHANNEL PAGE
   Cleaned mobile reference geometry
   ========================= */
.topbar{
  height:55px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.topbar-left,.topbar-right{
  display:flex;
  align-items:center;
}
.icon-btn{
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.topbar-left .icon-btn svg{
  width:20px;
  height:20px;
  display:block;
}
.topbar-right{gap:29px}
.topbar-right .icon-btn:first-child svg{
  width:22px;
  height:22px;
  display:block;
}
.topbar-right .icon-btn:last-child svg{
  width:16px;
  height:16px;
  display:block;
}

.banner-wrap{padding:0 15px}
.banner{
  width:100%;
  height:auto;
  aspect-ratio:631/174;
  object-fit:cover;
  border-radius:5px;
  display:block;
  background:#202020;
}

.channel{
  display:grid;
  grid-template-columns:72px 1fr;
  gap:16px;
  padding:12px 15px 12px;
  align-items:start;
}
.avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  border:1px solid #3f3f3f;
  background:#2b2b2b;
  margin-top:8px;
}
.channel-copy{min-width:0}
.channel-name{
  font-size:22px;
  line-height:1.08;
  font-weight:650;
  letter-spacing:-.35px;
  margin:0 0 6px;
}
.handle{
  font-size:12px;
  line-height:1.15;
  color:#f1f1f1;
  margin-bottom:9px;
}
.subscribers{
  display:flex;
  align-items:center;
  gap:3px;
  font-size:11px;
  line-height:1;
  color:#8f8f8f;
}
.sub-avatars{display:flex;align-items:center}
.sub-avatars span{
  display:block;
  width:10px;
  height:10px;
  border-radius:50%;
  border:1px solid var(--bg);
  margin-left:-2px;
}
.sub-avatars span:first-child{margin-left:0;background:#e9367d}
.sub-avatars span:nth-child(2){background:#4f3d3a}
.sub-avatars span:nth-child(3){background:#d7d7d7}
.sub-chevron{
  width:5px;
  height:5px;
  border-right:1px solid #ddd;
  border-top:1px solid #ddd;
  transform:rotate(45deg);
  margin-left:1px;
}

.website{
  display:flex;
  align-items:center;
  min-width:0;
  padding:8px 15px 0;
  color:#9f9f9f;
  font-size:10px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
}
.website-label{flex:0 0 auto}
.website-url{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#f1f1f1;
  font-weight:400;
}
.website .more-text{
  flex:0 0 auto;
  color:#f1f1f1;
  font-weight:400;
  margin-left:2px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:11px 15px 0;
}
.action{
  height:40px;
  border-radius:20px;
  background:#292929;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:13px;
  font-weight:500;
}
.action svg{width:20px;height:20px;display:block}

.tabs{
  margin-top:29px;
  border-bottom:1px solid #2a2a2a;
  height:30px;
  display:flex;
  align-items:flex-end;
  padding:0 15px;
  gap:25px;
}
.tab{
  height:30px;
  display:flex;
  align-items:center;
  position:relative;
  font-size:15px;
  font-weight:400;
  color:#a9a9a9;
}
.tab.active{color:#f1f1f1;font-weight:400}
.tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:1px;
  border-radius:1px;
  background:#f1f1f1;
}

.filters{
  height:56px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 15px;
  border-bottom:1px solid #1f1f1f;
}
.filter{
  height:32px;
  padding:0 12px;
  border-radius:6px;
  background:#242424;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
}
.filter.active{background:#f1f1f1;color:#111}

.shorts-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1px;
  background:#0f0f0f;
}
.card{
  position:relative;
  aspect-ratio:231/383;
  background:#272727;
  overflow:hidden;
}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.drafts{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
}
.drafts svg{width:21px;height:21px;margin-bottom:35px}
.drafts .draft-label{
  position:absolute;
  left:8px;
  bottom:6px;
  font-size:10px;
}

/* =========================
   SHARED BOTTOM NAVIGATION
   ========================= */
.bottom-navigation{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  width:100%;
  max-width:691px;
  margin:0 auto;
  background:var(--bg);
  border-top:1px solid #202020;
  z-index:100;
  padding-bottom:0;
  box-sizing:border-box;
}
.nav-items{
  height:100%;
  display:flex;
  align-items:stretch;
}
.nav-item{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  padding:4px 0 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:3px;
  text-decoration:none;
  color:inherit;
}
.nav-item.home-active{position:relative}
.nav-item.home-active::before{
  content:"";
  position:absolute;
  top:-1px;
  left:50%;
  width:50px;
  height:50px;
  transform:translateX(-50%);
  border-radius:50%;
  background:#050505;
  z-index:0;
}
.nav-item.home-active > *{position:relative;z-index:1}
.nav-icon{
  width:27px;
  height:27px;
  flex:0 0 27px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.nav-icon svg{width:27px;height:27px;display:block}
.nav-item:nth-child(2) .nav-icon{width:27px;height:27px;flex-basis:27px}
.nav-item:nth-child(2) .nav-icon svg{width:24px;height:24px;display:block}
.nav-item:nth-child(2) .nav-icon svg path:first-child{stroke-width:1.35}
.nav-label{
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  font-weight:400;
  line-height:1.05;
  color:#F1F1F1;
  white-space:nowrap;
}
.nav-create-circle{
  width:40px;
  height:40px;
  flex:0 0 40px;
  margin-top:-2px;
  background:#2D2D2D;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.nav-create-circle svg{width:20px;height:20px;display:block}
.nav-profile-avatar{
  width:24px;
  height:24px;
  flex:0 0 24px;
  margin-top:0;
  border-radius:50%;
  overflow:hidden;
  background:#4A4A4A;
}
.nav-profile-avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  background:#4A4A4A;
}

</style>
</head>
